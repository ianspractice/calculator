<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOP Calculator Project</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="main-container">
      <div id="display"></div>
      <div id="row1" class="row">
        <button><div class="number">7</div></button>
        <button><div class="number">8</div></button>
        <button><div class="number">9</div></button>
        <button><div class="operator">/</div></button>
      </div>
      <div id="row2" class="row">
        <button><div class="number">4</div></button>
        <button><div class="number">5</div></button>
        <button><div class="number">6</div></button>
        <button><div class="operator">x</div></button>
      </div>
      <div id="row3" class="row">
        <button><div class="number">1</div></button>
        <button><div class="number">2</div></button>
        <button><div class="number">3</div></button>
        <button><div class="operator">-</div></button>
      </div>
      <div id="row4" class="row">
        <button><div class="clear">CLEAR</div></button>
        <button><div class="number">0</div></button>
        <button><div class="operator">=</div></button>
        <button><div class="operator">+</div></button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
